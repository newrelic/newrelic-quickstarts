name: High Model Call Latency

description: |+
  This alert triggers when the average duration of Azure AI Foundry model calls exceeds acceptable thresholds.

type: STATIC
nrql:
  query: "SELECT average(duration.ms / 1000) FROM Span WHERE gen_ai.operation.name IN ('chat', 'text_completion', 'generate_content')"

valueFunction: SINGLE_VALUE

terms:
  - priority: CRITICAL
    operator: ABOVE
    threshold: 30
    thresholdDuration: 300
    thresholdOccurrences: ALL
  - priority: WARNING
    operator: ABOVE
    threshold: 15
    thresholdDuration: 300
    thresholdOccurrences: ALL

violationTimeLimitSeconds: 86400
