name: High Tool Call Error Rate

description: |+
  This alert triggers when the share of failed agent tool calls rises, which means agents are acting on missing or broken tool results.

type: STATIC
nrql:
  query: "SELECT percentage(count(*), WHERE otel.status_code = 'ERROR') FROM Span WHERE gen_ai.operation.name = 'execute_tool'"

valueFunction: SINGLE_VALUE

terms:
  - priority: CRITICAL
    operator: ABOVE
    threshold: 10
    thresholdDuration: 300
    thresholdOccurrences: ALL
  - priority: WARNING
    operator: ABOVE
    threshold: 5
    thresholdDuration: 300
    thresholdOccurrences: ALL

violationTimeLimitSeconds: 86400
