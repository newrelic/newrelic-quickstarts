# Name of the alert
name: Linkerd High HTTP Error Rate

# Description and details
description: |+
  This alert is triggered when the inbound HTTP 5xx error rate exceeds 5% for 5 minutes,
  indicating service errors being observed by the Linkerd proxy.

# Type of alert
type: STATIC

# NRQL query
nrql:
  query: "SELECT 100.0 * filter(sum(inbound_http_statuses_total), WHERE status LIKE '5%') / sum(inbound_http_statuses_total) FROM Metric WHERE instrumentation.provider = 'opentelemetry' AND linkerd_control_plane_component IS NULL"

# Function used to aggregate the NRQL query value(s) for comparison to the threshold
valueFunction: SINGLE_VALUE

# List of Critical and Warning thresholds for the condition
terms:
  - priority: CRITICAL
    operator: ABOVE
    threshold: 10
    thresholdDuration: 300
    thresholdOccurrences: ALL
  - priority: WARNING
    operator: ABOVE
    threshold: 5
    thresholdDuration: 300
    thresholdOccurrences: ALL

# Duration after which a violation automatically closes
violationTimeLimitSeconds: 86400
