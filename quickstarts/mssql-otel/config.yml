title: Microsoft SQL Server (OpenTelemetry)
summary: |
  Gain immediate, centralized visibility into your SQL Server instances with a dashboard covering Golden Metrics, Locks, Wait Stats, Transactions, Security & Principals, and Always-On / Failover replication.
description: |
  ## How to monitor Microsoft SQL Server with New Relic?
  The OpenTelemetry SQL Server receiver collects metrics from your running SQL Server instances. A New Relic entity will be created for each SQL Server instance, allowing you to easily explore, configure alerts, and compare metrics for all your SQL Server databases in one place.

  ### Microsoft SQL Server OTel quickstart highlights

  The SQL Server OTel quickstart comes with a pre-built dashboard visualizing:
  - Overview - Golden Metrics
  - Slow Queries
  - Active Queries
  - Execution Plans
  - Performance & Compilation
  - Memory & Buffer
  - Database Storage & IO
  - Wait Stats
  - Locks
  - Transactions
  - Latch Analysis
  - Thread Pool & TempDB
  - Security & Principals
  - Always-On / Failover
  - Resource Governor

  ### Why monitor Microsoft SQL Server with New Relic?
  New Relic SQL Server for OpenTelemetry quickstart gives you comprehensive visibility into your SQL Server databases alongside your apps and server infrastructure. Monitoring SQL Server is vital to catch blocking chains, deadlocks, and TempDB contention before they degrade application performance, ensuring optimal database operations and enhanced user experiences.
