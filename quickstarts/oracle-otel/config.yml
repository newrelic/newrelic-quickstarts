slug: oracle-otel
title: Oracle Database (OpenTelemetry)
summary: |
  Gain immediate, centralized visibility into your Oracle Database instances with a dashboard covering CPU & Performance, Memory, Locks & Deadlocks, Processes & Sessions, Transactions, and Tablespace usage.
description: |
  ## How to monitor Oracle Database with New Relic?
  The OpenTelemetry Oracle DB receiver collects metrics from your running Oracle Database instances. A New Relic entity will be created for each Oracle Database instance, allowing you to easily explore, configure alerts, and compare metrics for all your Oracle databases in one place.

  ### Oracle Database OTel quickstart highlights

  The Oracle Database OTel quickstart comes with a pre-built dashboard visualizing:
  - CPU & Performance
  - Execution & Parse
  - Physical Read/Write
  - Detailed Physical I/O
  - Network I/O
  - Buffer & Cache
  - Memory
  - Wait & DB Time
  - Locks & Deadlocks
  - Processes & Sessions
  - Transactions
  - Tablespace
  - Storage
  - Parallel Operations
  - Redo & Sort
  - Response Time
  - System (OS)

  ### Why monitor Oracle Database with New Relic?
  New Relic Oracle Database for OpenTelemetry quickstart gives you comprehensive visibility into your Oracle databases alongside your apps and server infrastructure. Monitoring Oracle Database is vital to catch resource contention, parsing overhead, and I/O bottlenecks before they degrade application performance, ensuring optimal database operations and enhanced user experiences.
