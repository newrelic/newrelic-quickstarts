title: TestMu AI (Formerly LambdaTest)
description: |
  ## About TestMu AI (Formerly LambdaTest)
  ​
  TestMu AI (formerly LambdaTest) is a full-stack agentic AI quality engineering platform for planning, authoring, executing, and analysing software quality at scale. Teams run manual and automated tests across 3,000+ browsers and 10,000+ real devices and operating systems, supported by AI agents such as KaneAI for test authoring and HyperExecute for test orchestration. LambdaTest rebranded to TestMu AI on January 12, 2026; the platform, team, infrastructure, and existing customer accounts are unchanged.

  ## TestMu AI and New Relic Integration

  The integration of TestMu AI with New Relic offers a seamless experience for users aiming to optimize and monitor their stats during automated test execution. By bridging the gap between testing and performance monitoring, this integration brings forward an out-of-the-box dashboard that enables users to visualize and understand their testing metrics in real-time, set against the backdrop of broader application performance insights offered by New Relic.

  ## TestMu AI Dashboard and Visualization

  Upon successful integration, the TestMu AI Dashboard in New Relic becomes a hub of insights. This tailored interface showcases key testing metrics, offering a comprehensive perspective on your automated testing endeavors. Gain a high-level view of test executions, failures, and compatibility issues, ensuring you're always in the know about the quality of your web or mobile applications.

  ### Test Overview

  - Holistic view of automated testing activities.
  - Displays key metrics such as test execution counts, pass rates, durations, etc.
  - Insights on website compatibility across different browsers and devices.
  - Immediate understanding of application's cross browser testing functionality.

  ### Test Errors Overview

  - Focuses on discrepancies and anomalies in tests.
  - Deep insights into test failures.
  - Highlights the nature and frequency of errors.
  - Provides information on environments where errors occurred.

  ### HyperExecute Overview
  
  - Monitors HyperExecute, the AI-native test orchestration cloud that runs tests up to 70% faster than traditional cloud grids. 
  - Tracks HyperExecute jobs, tasks, and stages in a single view.
  - Surfaces job, task, and stage trends over time.
  - Breaks down task status ratios to pinpoint orchestration bottlenecks.



  ## More about TestMu AI (Formerly LambdaTest)

  TestMu AI (Formerly LambdaTest) is the leading full-stack AI agentic testing cloud for end-to-end testing, trusted by 3M+ users and 18K+ enterprises across 132 countries, with 1.5B+ tests run on the platform.

  - **KaneAI**: GenAI-native testing agent that plans, authors and evolves end-to-end tests in natural language across web, mobile, API and database, and exports them to Selenium, Playwright, Cypress and Appium.
  - **Kane CLI**: Natural-language browser automation from the terminal for developers, QA teams and AI coding agents such as Claude Code, Codex CLI and Gemini CLI.
  - **Agent Testing**: AI agents that test chatbots, voice agents and video agents across 60–100+ auto-generated scenarios, scoring hallucination, bias and tone, with 30+ call metrics for phone agents.
  - **Test Management**: AI-native test case management that turns Jira tickets, PRDs and Figma flows into structured test cases, with two-way sync to Jira and Azure DevOps.
  - **SmartUI - Visual Testing Tool**: AI-native visual regression testing that cuts false positives by up to 95% and compares Figma designs against live pages.
  - **Accessibility Testing Agent**: Automated accessibility testing against WCAG A, AA and AAA, ADA and Section 508 across websites, Android and iOS apps, and PDFs.
  - **Agentic Test Cloud Platform**: Autonomous end-to-end testing across 3,000+ browser and OS combinations and 10,000+ real devices from a single platform.
  - **Real Devices Cloud**: Mobile app testing on 10,000+ real iOS and Android devices with network throttling, geolocation and biometric authentication testing.
  - **Test Automation Platform**: Cloud testing grid that runs Selenium, Playwright, Cypress, Puppeteer and 50+ frameworks in parallel with no infrastructure to maintain.
  - **Native App Automation Cloud**: Mobile app automation with Appium, Espresso, XCUITest and Detox on real devices, emulators and simulators.
  - **HyperExecute**: AI-native test orchestration that runs tests up to 70% faster with auto-split, FailFast and auto-healing, plus protocol-level load testing with JMeter and Gatling.
  - **Browser Cloud**: Scalable browser infrastructure for AI agents, with stealth mode, session persistence and support for Playwright, Puppeteer and Selenium.
  - **TestMu AI MCP Server**: Connects Claude, Cursor and GitHub Copilot to HyperExecute, SmartUI and accessibility test data, so teams can triage test failures from the IDE.
  - **Accessibility DevTools**: Chrome extension for web accessibility testing with full-page, multi-page, workflow and keyboard scans.
  - **Test Insights**: AI-native test intelligence with flaky test detection, failure clustering, root cause analysis and error forecasting.




