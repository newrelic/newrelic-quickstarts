title: TestMu AI (Formerly LambdaTest)
description: |
  ## About TestMu AI (Formerly LambdaTest)
  ​
  TestMu AI (formerly LambdaTest) is a full-stack agentic AI quality engineering platform for planning, authoring, executing, and analysing software quality at scale. Teams run manual and automated tests across 3,000+ browsers and 10,000+ real devices and operating systems, supported by AI agents such as KaneAI for test authoring and HyperExecute for test orchestration. LambdaTest rebranded to TestMu AI on January 12, 2026; the platform, team, infrastructure, and existing customer accounts are unchanged.

  ## TestMu AI and New Relic Integration

  The integration of TestMu AI with New Relic offers a seamless experience for users aiming to optimize and monitor their stats during automated test execution. By bridging the gap between testing and performance monitoring, this integration brings forward an out-of-the-box dashboard that enables users to visualize and understand their testing metrics in real-time, set against the backdrop of broader application performance insights offered by New Relic.

  ## TestMu AI Dashboard and Visualization

  Upon successful integration, the TestMu AI Dashboard in New Relic becomes a hub of insights. This tailored interface showcases key testing metrics, offering a comprehensive perspective on your automated testing endeavors. Gain a high-level view of test executions, failures, and compatibility issues, ensuring you're always in the know about the quality of your web or mobile applications.

  ### Test Overview

  - Holistic view of automated testing activities.
  - Displays key metrics such as test execution counts, pass rates, durations, etc.
  - Insights on website compatibility across different browsers and devices.
  - Immediate understanding of application's cross-browser functionality.

  ### Test Errors Overview

  - Focuses on discrepancies and anomalies in tests.
  - Deep insights into test failures.
  - Highlights the nature and frequency of errors.
  - Provides information on environments where errors occurred.

  ### HyperExecute Overview

  - Tracks HyperExecute jobs, tasks, and stages in a single view.
  - Surfaces job, task, and stage trends over time.
  - Breaks down task status ratios to pinpoint orchestration bottlenecks.


