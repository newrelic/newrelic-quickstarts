slug: mysql-otel
title: MySQL (OpenTelemetry)
summary: |
  Gain immediate, centralized visibility into your MySQL instances with a multi-page dashboard covering throughput, connections, InnoDB buffer pool, locks, table/index I/O, statement digests, and replication.
description: |
  ## How to monitor MySQL with New Relic?
  The OpenTelemetry MySQL receiver collects metrics from your running MySQL instances. A New Relic entity will be created for each MySQL instance, allowing you to easily explore, configure alerts, and compare metrics for all your MySQL databases in one place.

  ### MySQL OTel quickstart highlights

  The MySQL OTel quickstart comes with a pre-built dashboard visualizing:
  - Overview & Health
  - Throughput & Commands
  - Connections & Threads
  - X Protocol (mysqlx)
  - InnoDB Buffer Pool
  - InnoDB Row / Page / Log Ops
  - Joins, Sorts & Temp
  - Locks
  - Table & Index I/O Waits
  - Statement Digests
  - Table Storage
  - Caches & Open Resources
  - Replication

  ### Why monitor MySQL with New Relic?
  New Relic MySQL for OpenTelemetry quickstart gives you comprehensive visibility into your MySQL databases alongside your apps and server infrastructure. Monitoring MySQL is vital to catch lock contention, slow queries, and buffer pool pressure before they degrade application performance, ensuring optimal database operations and enhanced user experiences.
