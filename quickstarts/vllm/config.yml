slug: vllm
title: vLLM
description: |
  ## Why monitor vLLM?
  vLLM is an open-source inference and serving engine for large language models. When it runs out of KV cache, requests wait in the queue or get preempted and recomputed, and users see the time to first token go up. Watching the scheduler, the KV cache and the latency histograms tells you when a server needs more memory or more replicas.

  ## What's included in the vLLM quickstart?
  The quickstart uses the Prometheus metrics that vLLM serves on the `/metrics` path of its OpenAI-compatible server, sent to New Relic with Prometheus remote write.
  - Dashboard: requests running and waiting, KV cache usage, preemptions, prompt and generation tokens per second, prefix cache hit rate, finished requests by reason, time to first token, inter-token latency, end to end and queue time.
  - Alerts: KV cache nearly full, requests queueing, high time to first token.

  The queries use the metric names of the vLLM V1 engine, such as `vllm:kv_cache_usage_perc` and `vllm:inter_token_latency_seconds`.
summary: |
