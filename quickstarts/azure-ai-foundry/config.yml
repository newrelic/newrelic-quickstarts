title: Azure AI Foundry
description: |-
  ## Overview
  Azure AI Foundry hosts the models and agents behind a growing number of production applications. Agents plan, call models, and run tools in loops, so a single slow tool, a throttled deployment or a runaway loop can degrade the whole experience while every service still looks healthy.

  New Relic turns the OpenTelemetry GenAI spans your Foundry agents emit into a dashboard and alerts built around agents, models and tools.

  ### Understand how agents behave
  - See agent runs, run time and error rate for every agent.
  - Spot loops by tracking model calls and tool calls per agent run.
  - Follow any run to its full trace.

  ### Compare models
  - Compare latency, error rate, output speed and token use across every model deployment side by side.
  - Catch throttling early in the model call error rate.
  - See why generations stopped, including content filter hits.

  ### Control tokens and cost
  - Break down input, output and reasoning tokens by model.
  - Estimate spend from your own per-million-token prices.

  ### Catch regressions and connect to the rest of your stack
  - Compare latency, errors and tokens per release and against yesterday.
  - Correlate agent runs with the services and APIs they depend on.

  ### Get started
  Enable OpenTelemetry tracing for your Foundry agents and export it to New Relic over OTLP. Spans must carry the standard `gen_ai.*` attributes.

summary: |-
