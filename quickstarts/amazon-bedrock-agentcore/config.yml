slug: amazon-bedrock-agentcore
description: |
  ## Why should you monitor Amazon Bedrock AgentCore?
  Amazon Bedrock AgentCore runs your AI agents as multi-step workflows: an agent reasons with a model, calls tools, loops, and responds. When something is slow, expensive or wrong, you need to see which agent run, model call or tool call caused it.

  ### Understand agent behavior:
  Track agent runs, model calls and tool calls, spot runaway loops through model calls per agent run, and follow any run through its trace.

  ### Compare models and control cost:
  See latency, time to first token, error rate and throughput for every Bedrock model side by side. Estimate spend by model, agent and trace from token usage, and check how much of your prompts are served from cache.

  ### Catch failures and regressions early:
  Group failures into causes such as throttling, max token limits, concurrency limits, guardrail blocks, timeouts and access denied. Compare releases and today against yesterday to catch regressions after a deploy.

  ### Measure answer quality:
  Chart evaluator scores (groundedness, relevancy, toxicity and more) and list the answers that need review.

  ## What's included in the Amazon Bedrock AgentCore quickstart?
  A dashboard built on OpenTelemetry GenAI spans (`gen_ai.*`) with seven pages:
  - Agent orchestration
  - Model performance
  - Tool calls & dependencies
  - Tokens & cost
  - Answer quality
  - Reliability & safety
  - Drift & regression
  - Full-stack correlation

  It also includes 3 alerts: model call error rate, model call latency and tool call error rate.
