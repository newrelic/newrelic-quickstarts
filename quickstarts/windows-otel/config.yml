slug: windows-otel
title: Windows (OpenTelemetry Collector)
summary: |
  Use the New Relic Distribution of the OpenTelemetry Collector (NRDOT) to monitor your Windows host.
description: |
  ## Why monitor Windows with OpenTelemetry

  Your Windows hosts are the foundation everything else runs on. Losing visibility
  into host-level resource usage makes it hard to tell whether a problem belongs
  to the host or the workload running on it.

  ### Windows (OpenTelemetry Collector) quickstart highlights

  Monitor your Windows host using the New Relic Distribution of the OpenTelemetry
  Collector (NRDOT):

  - Collect CPU, memory, disk, and network metrics via the hostmetrics receiver
  - Use New Relic's own distribution of the OpenTelemetry Collector, pre-configured
    for New Relic ingest
  - Works alongside any other OpenTelemetry-instrumented workloads on the same host
