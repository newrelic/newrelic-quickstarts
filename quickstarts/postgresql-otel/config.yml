summary: |
  Gain immediate, centralized visibility into your PostgreSQL instances with a dashboard covering Database Overview, Slow & Active Queries, Transactions, Tables & Indexes, Buffer Cache, Background Writer, Locks, Replication/WAL.
description: |
  ## How to monitor PostgreSQL with New Relic?
  The OpenTelemetry PostgreSQL receiver collects metrics from your running PostgreSQL instances. A New Relic entity will be created for each PostgreSQL instance, allowing you to easily explore, configure alerts, and compare metrics for all your PostgreSQL databases in one place.

  ### PostgreSQL OTel quickstart highlights

  The PostgreSQL OTel quickstart comes with a pre-built dashboard visualizing:
  - Database Overview
  - Slow Queries
  - Active Queries
  - Transactions
  - Row Operations
  - Tables & Indexes
  - Buffer Cache & Blocks
  - Background Writer
  - Locks
  - Replication, WAL & Vector

  ### Why monitor PostgreSQL with New Relic?
  New Relic PostgreSQL for OpenTelemetry quickstart gives you comprehensive visibility into your PostgreSQL databases alongside your apps and server infrastructure. Monitoring PostgreSQL is vital to catch slow queries, lock contention, and replication lag before they degrade application performance, ensuring optimal database operations and enhanced user experiences.
