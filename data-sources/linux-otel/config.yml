id: linux-opentelemetry
displayName: Linux (OpenTelemetry Collector)
description: |
  Monitor your Linux host using the OpenTelemetry Collector, either the New
  Relic Distribution (NRDOT) or the upstream Contrib distribution. Collect
  host-level metrics such as CPU, memory, disk, and network via the
  OpenTelemetry hostmetrics receiver.
install:
  primary:
    nerdlet:
      nerdletId: marketplace.install-data-source
      nerdletState:
        dataSourceId: linux-opentelemetry
        frameworkConfigId: linux-otel
      requiresAccount: false

icon: logo.svg

keywords:
  - infrastructure
  - os
  - operating system
  - open telemetry
  - open source monitoring
  - featured
categoryTerms:
  - os
  - infrastructure
