id: linkerd-opentelemetry
displayName: Linkerd (OpenTelemetry Collector)
description: |
  Monitor Linkerd service mesh using OpenTelemetry Collector. Collect comprehensive metrics from proxy sidecars, control plane components, and Kubernetes workloads across self-hosted and managed Kubernetes clusters.
install:
