id: windows-opentelemetry
displayName: Windows (OpenTelemetry Collector)
description: |
  Monitor your Windows host with the OpenTelemetry Collector, using either
  the New Relic Distribution (NRDOT) or upstream Contrib. Collect host
  metrics such as CPU, memory, disk, and network with the hostmetrics
  receiver.
install:
  primary:
    nerdlet:
      nerdletId: marketplace.install-data-source
      nerdletState:
        dataSourceId: windows-opentelemetry
        frameworkConfigId: windows-otel
      requiresAccount: false

icon: logo.svg

keywords:
  - infrastructure
  - os
  - operating system
  - open telemetry
  - open source monitoring
  - featured
categoryTerms:
  - os
  - infrastructure
