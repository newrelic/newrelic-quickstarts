id: windows-opentelemetry
displayName: Windows (OpenTelemetry Collector)
description: |
  Monitor your Windows host using the New Relic Distribution of the OpenTelemetry
  Collector (NRDOT). Collect host-level metrics such as CPU, memory, disk, and
  network via the OpenTelemetry hostmetrics receiver.
install:
  primary:
    nerdlet:
      nerdletId: marketplace.install-data-source
      nerdletState:
        dataSourceId: windows-opentelemetry
        frameworkConfigId: windows-otel
      requiresAccount: false

icon: logo.svg

keywords:
  - infrastructure
  - os
  - operating system
  - open telemetry
  - open source monitoring
  - featured
categoryTerms:
  - os
  - infrastructure
