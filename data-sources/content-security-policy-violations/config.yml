id: content-security-policy-violations
displayName: Content Security Policy Violations
description: |
  Track Content Security Policy (CSP) violations reported by your users' browsers, captured by New Relic Browser as SecurityPolicyViolation events, to identify blocked resources, misconfigured policies, and potential client-side attacks.
